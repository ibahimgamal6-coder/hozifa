<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>نسخة احتياطية - مركز حذيفة</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% -10%,#0f3d2e,#06140f 62%) fixed;color:#f3efe2;font-family:Cairo,system-ui,Tahoma,sans-serif;padding:16px;overflow-x:hidden}

<script>
firebase.initializeApp({apiKey:"AIzaSyCSKolz-EyLB_stw51gwqhjP6iQizbfjWQ",authDomain:"hozifa-2b8ab.firebaseapp.com",projectId:"hozifa-2b8ab",storageBucket:"hozifa-2b8ab.firebasestorage.app",messagingSenderId:"1015605148858",appId:"1:1015605148858:web:d93f27bcd8d9291a449683"});
